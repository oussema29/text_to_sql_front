<div class="shell">

  <header class="toolbar">
    <div class="brand">
      <div class="logo-plate">
        <img src="images/bte-logo.jpg" alt="Banque de Tunisie et des Émirats">
      </div>
      <div class="brand-divider"></div>
      <span class="app-name">BanQuery</span>
    </div>

    <div class="user-zone">
      <div class="user-chip">
        <div class="avatar" [class.admin]="auth.isAdmin()">{{ auth.initials() }}</div>
        <div class="user-text">
          <span class="user-name">{{ auth.currentUser()?.username }}</span>
          <span class="user-role">{{ auth.isAdmin() ? 'ADMIN' : 'ANALYSTE' }}</span>
        </div>
      </div>
      <button type="button" class="logout-btn" (click)="logout()" title="Se déconnecter">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8A8D9B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <div class="body">

    <nav class="sidenav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Espace de requête
      </a>
      <a routerLink="/schema" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
        Explorateur de schéma
      </a>
      <a routerLink="/audit" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h13M3 10h9M3 15h6"/><circle cx="17" cy="16" r="4"/><path d="m20 19 2.5 2.5"/></svg>
        Journal d'audit
      </a>
      @if (auth.isAdmin()) {
        <a routerLink="/metadata" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Métadonnées du schéma
        </a>
      }
    </nav>

    <main class="content">
      <router-outlet />
    </main>

  </div>
</div>
